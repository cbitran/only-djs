<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f7f5">
  <title>ONLY DJs — Ative seu acesso</title>
  <link rel="stylesheet" href="portal.css?v=20260923c">
</head>
<body>
  <main class="portal">
    <header class="topbar accept-invite-topbar">
      <a class="accept-invite-brand" href="../index.html" aria-label="ONLY DJAYZ — início"><img src="../assets/logo.png" alt="ONLY DJAYZ"></a>
      <a class="mono" href="login.html">ACESSO ↗</a>
    </header>
    <section class="accept-invite-layout">
      <figure class="accept-invite-visual">
        <h2 class="accept-invite-manifesto"><span>READY</span><em>TO START</em></h2>
        <div class="accept-invite-character">
          <p class="accept-invite-next mono">NEXT UP —<br>YOU.</p>
          <img src="../assets/dj-female-flx4-wall-profile.webp" alt="DJ agachada ao lado da cabine, da landing page Only DJAYZ">
        </div>
      </figure>
      <div class="accept-invite-card">
        <div class="eyebrow mono" id="flow-label">ACESSO À SUA ÁREA</div>
        <h1>DEFINA SUA<br><em>SENHA.</em></h1>
        <p class="lede">Crie uma senha para entrar na sua área e acompanhar sua formação.</p>
        <form class="card" id="password-form">
          <label class="field"><span class="mono">NOVA SENHA</span><input name="password" type="password" autocomplete="new-password" minlength="10" required></label>
          <label class="field"><span class="mono">REPITA A SENHA</span><input name="confirmPassword" type="password" autocomplete="new-password" minlength="10" required></label>
          <button class="action mono" type="submit"><span>CRIAR SENHA E CONTINUAR</span><span>→</span></button>
          <button class="text-button mono" id="retry-activation" type="button" hidden>TENTAR ATIVAÇÃO NOVAMENTE</button>
          <p class="auth-status" id="password-status" role="status" aria-live="polite">Validando seu link…</p>
        </form>
      </div>
    </section>
  </main>
  <script src="supabase-config.js"></script>
  <script type="module" src="accept-invite.js?v=20260923b"></script>
</body>
</html>
